name: ci

# Full quality gate: lint, types, tests, architecture boundaries, and BOTH red
# teams (component-level and whole-system). A red-team escape fails the build —
# adversarial scenarios are a CI gate, not a manual afterthought.
on: [push, pull_request]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
      - name: Install (editable, with dev tools)
        run: python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check authgate_gate tests redteam boundaries

      - name: Types (mypy)
        run: mypy authgate_gate

      - name: Tests (pytest)
        run: pytest -q
        env:
          AUTHGATE_BACKEND: python

      - name: Architecture boundaries
        run: python boundaries/check_boundaries.py authgate_gate --policy boundaries/policy.json

      - name: Red team — components
        run: python redteam/red_team_components.py

      - name: Red team — whole system
        run: python redteam/red_team.py
